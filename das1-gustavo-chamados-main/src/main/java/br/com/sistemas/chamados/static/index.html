<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Chamados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeff3; --panel:#ffffff; --ink:#18242f; --muted:#5b6a77; --line:#d3dce4;
  --brand:#17607a; --brand-ink:#ffffff; --soft:#e1eef3; --danger:#b4332b;
  --alta:#b4332b; --media:#9a6200; --baixa:#2b7449;
  --aberto:#17607a; --andamento:#9a6200; --fechado:#5b6a77;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10181f; --panel:#18242f; --ink:#e6edf2; --muted:#93a3b1; --line:#2b3a47;
    --brand:#5cb6d3; --brand-ink:#0c1a22; --soft:#1d3340; --danger:#ff8b82;
    --alta:#ff8b82; --media:#f0b44c; --baixa:#6fd196;
    --aberto:#5cb6d3; --andamento:#f0b44c; --fechado:#93a3b1}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:grid;grid-template-columns:230px 1fr}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
nav{padding:28px 18px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh}
nav h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:0 8px 24px;line-height:1.15}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;margin-bottom:4px;border:0;border-radius:6px;background:none;cursor:pointer;font-weight:500;text-align:left}
nav button:hover{background:var(--bg)}
nav button[aria-current=true]{background:var(--soft);color:var(--brand);font-weight:700}
nav .n{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:32px clamp(16px,4vw,48px);min-width:0}
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
header.top h2{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td.act .btn{margin-left:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700;border:1.5px solid currentColor}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgba(10,20,28,.55)}
dialog form{padding:24px;display:grid;gap:14px}
dialog h3{margin:0;font-size:1.25rem}
label{display:grid;gap:4px;font-size:.9rem;font-weight:500}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:var(--danger);color:#fff}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  nav h1{width:100%;margin:0 0 8px}
  nav button{width:auto;gap:8px}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <header class="top"><h2 id="title"></h2><button class="btn primary" id="new"></button></header>
  <div class="chips" id="chips"></div>
  <div class="panel" id="list"></div>
</main>
<dialog id="dlg"><form id="form"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Configuração =====
   API vazio = mesma origem (index.html dentro de src/main/resources/static).
   Se abrir este arquivo direto no navegador, use 'http://localhost:8080' (e libere CORS no Spring). */
const API = '';
/* Valores iguais aos enums Java (PrioridadeEnum, StatusChamado, PerfilEnum). */
const PRIORIDADES = ['BAIXA', 'MEDIA', 'ALTA', 'CRITICA'];
const STATUS = ['ABERTO', 'EM_ANDAMENTO', 'AGUARDANDO_CLIENTE', 'FECHADO'];
const PERFIS = ['ADMIN', 'TECNICO'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => s ? s.replaceAll('_', ' ').toLowerCase().replace(/^./, c => c.toUpperCase()) : '';
const date = d => d ? d.split('-').reverse().join('/') : '';
const COR = {CRITICA:'alta', ALTA:'alta', MEDIA:'media', BAIXA:'baixa', ABERTO:'aberto', EM_ANDAMENTO:'andamento', AGUARDANDO_CLIENTE:'andamento', FECHADO:'fechado'};
const badge = v => v ? `<span class="badge" style="color:var(--${COR[v] || 'muted'})">${esc(fmt(v))}</span>` : '';

const data = {clientes: [], categorias: [], tecnicos: [], chamados: []};
const nome = (k, id) => esc(data[k].find(x => x.id === id)?.nome ?? '');

const E = {
  chamados: {titulo: 'Chamados', um: 'chamado', novo: 'Novo chamado', path: '/chamados', edit: true,
    cols: [['Título', r => esc(r.titulo)], ['Cliente', r => nome('clientes', r.clienteId)], ['Categoria', r => nome('categorias', r.categoriaId)],
      ['Técnico', r => nome('tecnicos', r.tecnicoId)], ['Prioridade', r => badge(r.prioridade)], ['Status', r => badge(r.status)], ['Abertura', r => date(r.dataAbertura)]],
    fields: [
      {n:'titulo', l:'Título', t:'text', req:1},
      {n:'descricao', l:'Descrição', t:'textarea'},
      {n:'prioridade', l:'Prioridade', t:'select', o:PRIORIDADES, req:1, row:1},
      {n:'status', l:'Status', t:'select', o:STATUS, req:1, row:1, soEdicao:1},
      {n:'clienteId', l:'Cliente', t:'ref', ref:'clientes', req:1},
      {n:'categoriaId', l:'Categoria', t:'ref', ref:'categorias', req:1, row:1},
      {n:'tecnicoId', l:'Técnico', t:'ref', ref:'tecnicos', req:1, row:1},
      {n:'dataAbertura', l:'Data de abertura', t:'date', row:1, soEdicao:1},
      {n:'dataFechamento', l:'Data de fechamento', t:'date', row:1}]},
  clientes: {titulo: 'Clientes', um: 'cliente', novo: 'Novo cliente', path: '/clientes', edit: false,
    cols: [['Nome', r => esc(r.nome)], ['E-mail', r => esc(r.email)], ['Telefone', r => esc(r.telefone)]],
    fields: [
      {n:'nome', l:'Nome', t:'text', req:1},
      {n:'email', l:'E-mail', t:'email', req:1},
      {n:'telefone', l:'Telefone', t:'text'}]},
  tecnicos: {titulo: 'Técnicos', um: 'técnico', novo: 'Novo técnico', path: '/tecnicos', edit: true,
    cols: [['Nome', r => esc(r.nome)], ['E-mail', r => esc(r.email)], ['Perfil', r => badge(r.perfil)]],
    fields: [
      {n:'nome', l:'Nome', t:'text', req:1},
      {n:'email', l:'E-mail', t:'email', req:1},
      {n:'perfil', l:'Perfil', t:'select', o:PERFIS, req:1}]},
  categorias: {titulo: 'Categorias', um: 'categoria', novo: 'Nova categoria', path: '/categorias', edit: true,
    cols: [['Nome', r => esc(r.nome)], ['Descrição', r => esc(r.descricao)]],
    fields: [
      {n:'nome', l:'Nome', t:'text', req:1},
      {n:'descricao', l:'Descrição', t:'textarea'}]}
};

let tab = 'chamados', filtro = null;
const $ = id => document.getElementById(id);

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = '', 3500);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (!res.ok) {
    let m = res.statusText;
    try { const j = await res.json(); m = j.message || j.detail || j.error || JSON.stringify(j); } catch {}
    throw new Error(`Erro ${res.status}: ${m}`);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function carregar(k) { data[k] = await api(E[k].path); }
async function carregarTudo() {
  const ks = Object.keys(E);
  const r = await Promise.allSettled(ks.map(carregar));
  if (r.some(x => x.status === 'rejected')) toast('Não foi possível ler a API. Confira se o Spring Boot está rodando em localhost:8080.', true);
  render();
}

function render() {
  const e = E[tab];
  $('nav').innerHTML = '<h1>Central de<br>chamados</h1>' + Object.keys(E).map(k =>
    `<button data-tab="${k}" aria-current="${k === tab}">${E[k].titulo}<span class="n">${data[k].length}</span></button>`).join('');
  $('title').textContent = e.titulo;
  $('new').textContent = e.novo;

  let rows = data[tab];
  if (tab === 'chamados') {
    $('chips').innerHTML = [null, ...STATUS].map(s => {
      const n = s ? data.chamados.filter(c => c.status === s).length : data.chamados.length;
      return `<button class="chip" data-f="${s ?? ''}" aria-pressed="${filtro === s}">${s ? fmt(s) : 'Todos'} (${n})</button>`;
    }).join('');
    if (filtro) rows = rows.filter(c => c.status === filtro);
  } else $('chips').innerHTML = '';

  if (!rows.length) {
    $('list').innerHTML = `<div class="empty">Nenhum ${e.um} por aqui. Use “${e.novo}” para cadastrar o primeiro.</div>`;
    return;
  }
  $('list').innerHTML = `<table><thead><tr>${e.cols.map(c => `<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>` +
    rows.map(r => `<tr>${e.cols.map(c => `<td>${c[1](r)}</td>`).join('')}<td class="act">` +
      (e.edit ? `<button class="btn sm" data-edit="${r.id}">Editar</button>` : '') +
      `<button class="btn sm danger" data-del="${r.id}">Excluir</button></td></tr>`).join('') + '</tbody></table>';
}

function abrirForm(item) {
  const e = E[tab], f = $('form');
  const campo = c => {
    const v = item?.[c.n] ?? '';
    const req = c.req ? 'required' : '';
    let el;
    if (c.t === 'textarea') el = `<textarea name="${c.n}" ${req}>${esc(v)}</textarea>`;
    else if (c.t === 'select') el = `<select name="${c.n}" ${req}>${c.o.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${esc(fmt(o))}</option>`).join('')}</select>`;
    else if (c.t === 'ref') el = `<select name="${c.n}" ${req}><option value="">${c.req ? 'Escolha…' : 'Nenhum'}</option>${data[c.ref].map(o => `<option value="${o.id}" ${o.id === v ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')}</select>`;
    else el = `<input name="${c.n}" type="${c.t}" value="${esc(v)}" ${req}>`;
    return `<label>${c.l}${el}</label>`;
  };
  const fields = e.fields.filter(c => !c.soEdicao || item);
  let html = '', i = 0;
  while (i < fields.length) {
    const c = fields[i];
    if (c.row && fields[i + 1]?.row) { html += `<div class="row">${campo(c)}${campo(fields[i + 1])}</div>`; i += 2; }
    else { html += campo(c); i++; }
  }
  f.dataset.id = item?.id ?? '';
  f.innerHTML = `<h3>${item ? 'Editar' : 'Novo'} ${e.um}</h3>${html}
    <div class="foot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar ${e.um}</button></div>`;
  $('dlg').showModal();
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; filtro = null; render(); }
  else if (b.dataset.f !== undefined && b.classList.contains('chip')) { filtro = b.dataset.f || null; render(); }
  else if (b.id === 'new') abrirForm();
  else if (b.id === 'cancel') $('dlg').close();
  else if (b.dataset.edit) abrirForm(data[tab].find(x => x.id == b.dataset.edit));
  else if (b.dataset.del) {
    if (!confirm(`Excluir este ${E[tab].um}? Essa ação não pode ser desfeita.`)) return;
    try { await api(`${E[tab].path}/${b.dataset.del}`, {method: 'DELETE'}); toast('Excluído.'); await carregarTudo(); }
    catch (e) { toast(e.message, true); }
  }
});

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const e = E[tab], f = ev.target, body = {};
  e.fields.forEach(c => {
    if (!f.elements[c.n]) return;
    const v = f.elements[c.n].value;
    body[c.n] = c.t === 'ref' ? (v ? Number(v) : null) : c.t === 'date' ? (v || null) : v;
  });
  const id = f.dataset.id;
  try {
    await api(id ? `${e.path}/${id}` : e.path, {method: id ? 'PUT' : 'POST', body: JSON.stringify(body)});
    $('dlg').close(); toast('Salvo.'); await carregarTudo();
  } catch (err) { toast(err.message, true); }
});

carregarTudo();
</script>
</body>
</html>
